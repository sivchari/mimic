name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
      # Same analyzers as `gokui lint`: go vet's standard set plus modernize.
      - name: go vet
        run: go vet ./...
      - name: modernize
        run: go run golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@v0.52.0 ./...
